<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Royal Imóveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="config.js"></script>
</head>
<body>

<div class="wrap centro">
  <div class="cartao">
    <div class="brand">
      <img src="assets/royal-logo.png" alt="Royal Imóveis RJ">
    </div>

    <h1>Acompanhe sua compra</h1>
    <p class="sub">
      Informe o e-mail cadastrado na sua negociação. Enviamos um link de acesso
      para você — não precisa de senha.
    </p>

    <form id="form-login" novalidate>
      <label for="email">Seu e-mail</label>
      <input type="email" id="email" name="email" autocomplete="email"
             placeholder="voce@exemplo.com" required>
      <button type="submit" id="botao">Receber link de acesso</button>
    </form>

    <div class="aviso ok"   id="aviso-ok"   hidden></div>
    <div class="aviso erro" id="aviso-erro" hidden></div>

    <p class="rodape">
      O link vale por pouco tempo e só funciona uma vez. Se não chegar em
      alguns minutos, confira a caixa de spam ou fale com seu corretor.
    </p>
  </div>
</div>

<script type="module" src="assets/login.js"></script>
</body>
</html>
