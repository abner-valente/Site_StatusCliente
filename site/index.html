<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Royal Imóveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="config.js"></script>
</head>
<body>

<div class="wrap centro">
  <div class="cartao">
    <div class="brand">
      <svg viewBox="0 0 48 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M5 32 L5 15 L15 22.5 L24 8 L33 22.5 L43 15 L43 32 Z" fill="var(--accent)"/>
        <circle cx="5" cy="12.5" r="3.4" fill="var(--accent)"/>
        <circle cx="24" cy="6" r="3.8" fill="var(--accent)"/>
        <circle cx="43" cy="12.5" r="3.4" fill="var(--accent)"/>
        <rect x="5" y="31" width="38" height="4" rx="1.3" fill="var(--accent)"/>
      </svg>
      <div class="brand-text">
        <span class="r1">ROYAL</span>
        <span class="r2">Imóveis RJ</span>
      </div>
    </div>

    <h1>Acompanhe sua compra</h1>
    <p class="sub">
      Informe o e-mail cadastrado na sua negociação. Enviamos um link de acesso
      para você — não precisa de senha.
    </p>

    <form id="form-login" novalidate>
      <label for="email">Seu e-mail</label>
      <input type="email" id="email" name="email" autocomplete="email"
             placeholder="voce@exemplo.com" required>
      <button type="submit" id="botao">Receber link de acesso</button>
    </form>

    <div class="aviso ok"   id="aviso-ok"   hidden></div>
    <div class="aviso erro" id="aviso-erro" hidden></div>

    <p class="rodape">
      O link vale por pouco tempo e só funciona uma vez. Se não chegar em
      alguns minutos, confira a caixa de spam ou fale com seu corretor.
    </p>
  </div>
</div>

<script type="module">
// TODO endurecer: fixar a versão exata do supabase-js e adicionar integridade
// (SRI) antes de colocar clientes reais. `@2` acompanha as versões menores,
// o que é cômodo no desenvolvimento e indesejado em produção.
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const cfg = window.ROYAL_CONFIG || {};
const form     = document.getElementById("form-login");
const campo    = document.getElementById("email");
const botao    = document.getElementById("botao");
const avisoOk  = document.getElementById("aviso-ok");
const avisoErr = document.getElementById("aviso-erro");

function mostrar(el, texto){
  el.textContent = texto;
  el.hidden = false;
}
function limpar(){
  avisoOk.hidden = true;
  avisoErr.hidden = true;
}

if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes("SEU_PROJECT_REF")
    || !cfg.SUPABASE_ANON_KEY || cfg.SUPABASE_ANON_KEY.includes("COLE_AQUI")) {
  botao.disabled = true;
  mostrar(avisoErr, "Configuração pendente: preencha site/config.js com a URL do projeto e a chave anon.");
} else {
  const sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  // Quem já tem sessão válida não precisa ver esta tela.
  const { data: { session } } = await sb.auth.getSession();
  if (session) location.replace("painel.html");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    limpar();

    const email = campo.value.trim().toLowerCase();
    if (!email || !email.includes("@")) {
      mostrar(avisoErr, "Digite um e-mail válido.");
      campo.focus();
      return;
    }

    botao.disabled = true;
    botao.textContent = "Enviando…";

    const { error } = await sb.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: new URL("painel.html", location.href).href,
        // Impede que um e-mail desconhecido crie conta. É a segunda barreira:
        // a primeira é o cadastro público desligado no painel do Supabase.
        // Sem isso, qualquer pessoa criaria conta com a chave anon, que é
        // pública por natureza.
        shouldCreateUser: false,
      },
    });

    botao.disabled = false;
    botao.textContent = "Receber link de acesso";

    if (error) {
      // A mensagem ao usuário é sempre a mesma, com ou sem erro: dizer
      // "e-mail não cadastrado" confirmaria a terceiros quem é cliente da
      // Royal. O detalhe fica no console, para suporte.
      console.warn("Falha no envio do link:", error.message);
    }

    form.hidden = true;
    mostrar(avisoOk,
      "Se este e-mail estiver cadastrado na sua negociação, o link de acesso " +
      "chega em instantes. Confira também a caixa de spam.");
  });
}
</script>
</body>
</html>
