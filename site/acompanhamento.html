<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhamento · Royal Imóveis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="config.js"></script>
</head>
<body>

<div class="wrap" id="app">
  <div class="estado"><h2>Carregando…</h2><p>Buscando o andamento da sua negociação.</p></div>
</div>

<script type="module">
import { criarClienteRoyal } from "./assets/cliente.js";

const cfg = window.ROYAL_CONFIG || {};
const app = document.getElementById("app");

// Agrupamento das etapas em cards, por código — não por posição.
// O código é estável entre reestruturações da planilha; a ordem não é.
// Etapa cujo código não estiver aqui cai num card "Outras etapas", para
// aparecer em vez de sumir da tela sem ninguém perceber.
const GRUPOS = [
  { nome: "Contrato",         codigos: ["minuta", "onus"] },
  { nome: "Sinal",            codigos: ["sinal"] },
  { nome: "Certidões e ITBI", codigos: ["certidoes", "itbi"] },
  { nome: "Escritura",        codigos: ["amaurilio", "agendamento_escritura"] },
  { nome: "Financiamento",    codigos: ["contrato_banco"] },
  { nome: "Registro",         codigos: ["entrada_rgi", "protocolo"] },
  { nome: "Entrega",          codigos: ["pasta"] },
];

const STATUS = {
  concluido:    { cls: "st-done",     rotulo: "" },
  em_andamento: { cls: "st-progress", rotulo: "Em andamento" },
  pendente:     { cls: "st-pending",  rotulo: "Pendente" },
  atrasado:     { cls: "st-late",     rotulo: "Atrasado" },
  cancelado:    { cls: "st-cancel",   rotulo: "Cancelado" },
  nao_iniciado: { cls: "st-idle",     rotulo: "" },
};

const MARCA = '<div class="brand">'
  + '<svg viewBox="0 0 48 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
  + '<path d="M5 32 L5 15 L15 22.5 L24 8 L33 22.5 L43 15 L43 32 Z" fill="var(--accent)"/>'
  + '<circle cx="5" cy="12.5" r="3.4" fill="var(--accent)"/>'
  + '<circle cx="24" cy="6" r="3.8" fill="var(--accent)"/>'
  + '<circle cx="43" cy="12.5" r="3.4" fill="var(--accent)"/>'
  + '<rect x="5" y="31" width="38" height="4" rx="1.3" fill="var(--accent)"/>'
  + '</svg><div class="brand-text"><span class="r1">ROYAL</span>'
  + '<span class="r2">Imóveis RJ</span></div></div>';

const CHECK = '<svg viewBox="0 0 10 10" aria-hidden="true"><polyline points="1,5.2 4,8 9,1.5"'
  + ' fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// Dado vindo do banco vai para o DOM como texto, nunca como HTML.
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  ));
}

function estado(titulo, texto, comVoltar){
  app.innerHTML = `<div class="estado"><h2>${esc(titulo)}</h2><p>${esc(texto)}</p>`
    + (comVoltar ? '<p style="margin-top:18px"><a href="painel.html">Voltar</a></p>' : "")
    + '</div>';
}

function diasEntre(iso){
  if (!iso) return null;
  const ms = Date.now() - new Date(iso).getTime();
  return Math.max(0, Math.floor(ms / 86400000));
}

let sb;
try {
  sb = criarClienteRoyal(cfg);
} catch (e) {
  estado("Não foi possível iniciar", e.message);
}

if (sb) {
  const id = new URLSearchParams(location.search).get("p");
  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    location.replace("index.html");
  } else if (!id) {
    location.replace("painel.html");
  } else {
    // Três consultas independentes. A RLS filtra as duas primeiras; a terceira
    // é o catálogo, que não tem nada sensível e é legível por quem está logado.
    const [rProc, rEtapas, rCat] = await Promise.all([
      sb.from("processos")
        .select("id, imovel, corretor, modalidade, data_assinatura, ativo")
        .eq("id", id).maybeSingle(),
      sb.from("processo_etapas")
        .select("etapa_id, status, desde")
        .eq("processo_id", id),
      sb.from("etapas_catalogo")
        .select("id, modalidade, ordem, codigo, rotulo_publico"),
    ]);

    const erro = rProc.error || rEtapas.error || rCat.error;
    if (erro) {
      console.error("Falha ao carregar o acompanhamento:", erro);
      estado("Não foi possível carregar",
             "Tente novamente em instantes ou fale com seu corretor.", true);
    } else if (!rProc.data) {
      // Vazio aqui significa uma de duas coisas: o processo não existe, ou
      // existe e não é desta pessoa — a RLS não distingue, e é bom que não
      // distinga. A mensagem é a mesma nos dois casos, para não confirmar a
      // existência de um processo alheio a quem tentou adivinhar o id.
      estado("Negociação não encontrada",
             "Este acompanhamento não está disponível para a sua conta.", true);
    } else {
      renderizar(rProc.data, rEtapas.data || [], rCat.data || [], session.user.email);
    }
  }

  function renderizar(proc, etapas, catalogo, email){
    const porId = new Map(catalogo.map(e => [e.id, e]));

    // Junta estado e catálogo no cliente. Poderia ser um embed do PostgREST,
    // mas a chave estrangeira de processo_etapas é composta (etapa_id,
    // modalidade) e o embed automático não é confiável com esse formato.
    const linhas = etapas
      .map(pe => ({ ...pe, cat: porId.get(pe.etapa_id) }))
      .filter(l => l.cat)
      .sort((a, b) => a.cat.ordem - b.cat.ordem);

    const concluidas = linhas.filter(l => l.status === "concluido").length;
    const total = linhas.length;
    const pct = total ? Math.round((concluidas / total) * 100) : 0;

    const atual = linhas.find(l => l.status !== "concluido" && l.status !== "cancelado");

    const usados = new Set();
    const cards = GRUPOS.map(g => {
      const itens = linhas.filter(l => g.codigos.includes(l.cat.codigo));
      itens.forEach(l => usados.add(l.cat.codigo));
      if (!itens.length) return "";
      return cardHtml(g.nome, itens);
    }).join("");

    const sobra = linhas.filter(l => !usados.has(l.cat.codigo));
    const cardsFinais = cards + (sobra.length ? cardHtml("Outras etapas", sobra) : "");

    const dias = diasEntre(proc.data_assinatura);
    const assinatura = proc.data_assinatura
      ? new Date(proc.data_assinatura + "T00:00:00").toLocaleDateString("pt-BR")
      : null;

    const meta = [
      assinatura ? `Assinatura em <b>${esc(assinatura)}</b>` : null,
      dias !== null ? `<b>${dias}</b> dias de processo` : null,
      proc.corretor ? `Corretor: <b>${esc(proc.corretor)}</b>` : null,
      `Modalidade: <b>${proc.modalidade === "avista" ? "À vista" : "Financiado"}</b>`,
    ].filter(Boolean).join(" · ");

    const emAndamento = atual
      ? `<p class="meta" style="margin-top:8px">Etapa atual: <b>${esc(atual.cat.rotulo_publico)}</b>`
        + (diasEntre(atual.desde) !== null ? ` · há ${diasEntre(atual.desde)} dias` : "")
        + `</p>`
      : `<p class="meta" style="margin-top:8px"><b>Processo concluído.</b></p>`;

    app.innerHTML =
      '<div class="topbar"><div class="heading">'
      + '<p class="eyebrow">Acompanhamento de transação</p>'
      + '<h1>' + esc(proc.imovel) + '</h1>'
      + '<p class="meta">' + meta + '</p>'
      + emAndamento
      + '</div>' + MARCA + '</div>'
      + '<div class="progress-row">'
      + '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>'
      + '<div class="progress-label">' + concluidas + ' de ' + total + ' etapas · ' + pct + '%</div>'
      + '</div>'
      + '<div class="grid">' + cardsFinais + '</div>'
      + '<div class="legend">'
      + '<div class="lg-item"><span class="dot" style="background:var(--ok)"></span>Concluído</div>'
      + '<div class="lg-item"><span class="dot" style="background:var(--warn)"></span>Em andamento</div>'
      + '<div class="lg-item"><span class="dot" style="border:1.5px solid var(--idle);background:transparent"></span>A fazer</div>'
      + '</div>'
      + '<div class="foot">'
      + '<span>' + esc(email) + '</span>'
      + '<span><a href="painel.html">Minhas negociações</a> &nbsp; '
      + '<button id="sair">Sair</button></span>'
      + '</div>';

    document.getElementById("sair").addEventListener("click", async () => {
      await sb.auth.signOut();
      location.replace("index.html");
    });
  }

  function cardHtml(nome, itens){
    const feitas = itens.filter(i => i.status === "concluido").length;
    const html = itens.map(i => {
      const meta = STATUS[i.status] || STATUS.nao_iniciado;
      const tag = meta.rotulo ? '<span class="tag">' + esc(meta.rotulo) + '</span>' : "";
      return '<div class="item ' + meta.cls + '">'
        + '<span class="box">' + (i.status === "concluido" ? CHECK : "") + '</span>'
        + '<span class="label">' + esc(i.cat.rotulo_publico) + tag + '</span></div>';
    }).join("");
    return '<div class="card"><div class="card-head"><h2>' + esc(nome) + '</h2>'
      + '<span>' + feitas + '/' + itens.length + '</span></div>'
      + '<div class="items">' + html + '</div></div>';
  }
}
</script>
</body>
</html>
