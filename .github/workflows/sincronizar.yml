# Royal Imóveis — sincronização planilha -> banco
#
# PARA LIGAR O AGENDAMENTO
#   1. cadastre os secrets em Settings -> Secrets and variables -> Actions:
#        SUPABASE_URL
#        SUPABASE_SERVICE_ROLE_KEY
#        GOOGLE_SHEET_ID
#        GOOGLE_CREDENTIALS_JSON   (o JSON inteiro da service account)
#   2. rode uma vez pelo botão "Run workflow", com "aplicar" DESMARCADO,
#      e confira o plano no log
#   3. descomente o bloco `schedule` abaixo
#
# Enquanto o passo 3 não acontece, o workflow só roda quando alguém aperta o
# botão. É de propósito: um agendamento que falha a cada 15 minutos treina todo
# mundo a ignorar a notificação — justamente o aviso que precisa funcionar
# quando algo quebrar de verdade.
#
# Benefício colateral do cron: projeto free do Supabase pausa após uma semana
# sem atividade. Uma execução a cada 15 minutos mantém o banco acordado.

name: Sincronizar planilha

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Gravar no banco (desmarcado apenas simula)"
        type: boolean
        default: false
      forcar:
        description: "Ignorar a guarda de sanidade"
        type: boolean
        default: false

  # schedule:
  #   - cron: "*/15 * * * *"

concurrency:
  # Duas execuções simultâneas comparariam o mesmo estado e gravariam histórico
  # duplicado. A segunda espera; nenhuma é cancelada no meio de uma escrita.
  group: sincronizar
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Estes dois mandam sobre o que vier no secret ENV. O load_dotenv não
      # sobrescreve variável que já existe no ambiente, então um ENV copiado da
      # máquina de desenvolvimento — que aponta para o arquivo .xlsx local —
      # não faz o workflow ler a fonte errada.
      FONTE_PLANILHA: google_sheets
      GOOGLE_CREDENTIALS_FILE: credenciais-google.json

      SYNC_HABILITADO: ${{ vars.SYNC_HABILITADO || '1' }}
      LIMITE_MUDANCA_EM_MASSA: ${{ vars.LIMITE_MUDANCA_EM_MASSA || '0.30' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Montar .env e credenciais
        # Dois secrets só: ENV com o mesmo conteúdo do .env local, e
        # GOOGLE_CREDENTIALS_JSON com a chave da service account.
        #
        # Nada daqui é impresso. O log mostra apenas quais nomes de variável
        # foram definidos, nunca os valores.
        env:
          ENV: ${{ secrets.ENV }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          faltando=""
          [ -z "$ENV" ] && faltando="$faltando ENV"
          [ -z "$GOOGLE_CREDENTIALS_JSON" ] && faltando="$faltando GOOGLE_CREDENTIALS_JSON"
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando"
            exit 1
          fi

          printf '%s\n' "$ENV" > .env
          printf '%s'   "$GOOGLE_CREDENTIALS_JSON" > credenciais-google.json
          chmod 600 .env credenciais-google.json

          echo "Variáveis recebidas no .env:"
          grep -oE '^[A-Z_]+=' .env | tr -d '=' | sed 's/^/  /'

          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY GOOGLE_SHEET_ID; do
            grep -q "^$v=." .env || { echo "::error::$v ausente ou vazia no secret ENV"; exit 1; }
          done

          python -c "import json,sys; json.load(open('credenciais-google.json')); print('credenciais-google.json: JSON valido')"

      - name: Sincronizar
        run: |
          args=""
          if [ "${{ inputs.aplicar }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            args="--aplicar"
          fi
          if [ "${{ inputs.forcar }}" = "true" ]; then
            args="$args --forcar"
          fi
          echo "Executando: python sincronizar.py $args"
          python sincronizar.py $args

      # Código de saída 2 é a guarda de sanidade, não uma falha de
      # infraestrutura. O job falha de propósito, para a notificação chegar —
      # é o aviso de que algo grande mudou na planilha e ninguém avisou.
      - name: Explicar a falha
        if: failure()
        run: |
          echo "::warning::Sincronização não concluída. Saída 2 = guarda de sanidade"
          echo "(mudança em massa, processo sumido, uid desconhecido ou muitos"
          echo "acessos revogados de uma vez)."
          echo "Confira o log acima e, se a mudança for legítima, rode este"
          echo "workflow manualmente com 'forcar' marcado."
