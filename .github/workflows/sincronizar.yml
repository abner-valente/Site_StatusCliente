# Royal Imóveis — sincronização planilha -> banco
#
# Roda todo dia às 19:00 de Brasília, e sob demanda pelo botão "Run workflow".
#
# SECRETS necessários, em Settings -> Secrets and variables -> Actions:
#   ENV                       o mesmo conteúdo do .env local
#   GOOGLE_CREDENTIALS_JSON   o JSON da service account do Google
#
# ARMADILHA DO GITHUB: workflow agendado é DESATIVADO automaticamente após
# 60 dias sem commit no repositório. Este projeto pode ficar meses parado — se
# isso acontecer, o sync simplesmente para, e o sintoma é o site envelhecendo
# sem ninguém perceber. O GitHub avisa o dono do repositório por e-mail quando
# desativa; não ignore esse aviso. Um commit qualquer reativa.
#
# Benefício colateral: projeto free do Supabase pausa após uma semana sem
# atividade. Uma execução diária mantém o banco acordado.

name: Sincronizar planilha

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Gravar no banco (desmarcado apenas simula)"
        type: boolean
        default: false
      forcar:
        description: "Ignorar a guarda de sanidade"
        type: boolean
        default: false

  schedule:
    # 22:00 UTC = 19:00 em Brasília, depois do expediente. Assim o que o time
    # editou durante o dia aparece no site na mesma noite, e o cliente que
    # olhar de manhã já vê o estado atual.
    #
    # Uma vez por dia é adequado a um processo que se move ao longo de meses.
    # Para deixar mais frequente, troque a hora por um intervalo — "0 */6 * * *"
    # roda de 6 em 6 horas.
    #
    # O horário do GitHub é sempre UTC, e o Brasil não tem mais horário de
    # verão, então 22:00 UTC é 19:00 o ano inteiro.
    - cron: "0 22 * * *"

concurrency:
  # Duas execuções simultâneas comparariam o mesmo estado e gravariam histórico
  # duplicado. A segunda espera; nenhuma é cancelada no meio de uma escrita.
  group: sincronizar
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Estes dois mandam sobre o que vier no secret ENV. O load_dotenv não
      # sobrescreve variável que já existe no ambiente, então um ENV copiado da
      # máquina de desenvolvimento — que aponta para o arquivo .xlsx local —
      # não faz o workflow ler a fonte errada.
      FONTE_PLANILHA: google_sheets
      GOOGLE_CREDENTIALS_FILE: credenciais-google.json

      SYNC_HABILITADO: ${{ vars.SYNC_HABILITADO || '1' }}
      LIMITE_MUDANCA_EM_MASSA: ${{ vars.LIMITE_MUDANCA_EM_MASSA || '0.30' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Montar .env e credenciais
        # Dois secrets só: ENV com o mesmo conteúdo do .env local, e
        # GOOGLE_CREDENTIALS_JSON com a chave da service account.
        #
        # Nada daqui é impresso. O log mostra apenas quais nomes de variável
        # foram definidos, nunca os valores.
        env:
          ENV: ${{ secrets.ENV }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          faltando=""
          [ -z "$ENV" ] && faltando="$faltando ENV"
          [ -z "$GOOGLE_CREDENTIALS_JSON" ] && faltando="$faltando GOOGLE_CREDENTIALS_JSON"
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando"
            exit 1
          fi

          printf '%s\n' "$ENV" > .env
          printf '%s'   "$GOOGLE_CREDENTIALS_JSON" > credenciais-google.json
          chmod 600 .env credenciais-google.json

          echo "Variáveis recebidas no .env:"
          grep -oE '^[A-Z_]+=' .env | tr -d '=' | sed 's/^/  /'

          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY GOOGLE_SHEET_ID; do
            grep -q "^$v=." .env || { echo "::error::$v ausente ou vazia no secret ENV"; exit 1; }
          done

          python -c "import json,sys; json.load(open('credenciais-google.json')); print('credenciais-google.json: JSON valido')"

      - name: Sincronizar
        run: |
          args=""
          if [ "${{ inputs.aplicar }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            args="--aplicar"
          fi
          if [ "${{ inputs.forcar }}" = "true" ]; then
            args="$args --forcar"
          fi
          echo "Executando: python sincronizar.py $args"
          python sincronizar.py $args

      # Saídas 2 e 3 não são falha de infraestrutura. O job falha de propósito
      # nos dois casos, porque é a notificação do GitHub que faz alguém olhar.
      #
      #   2  guarda de sanidade: NADA foi gravado
      #   3  gravou o que podia, mas há linha pendente na aba Titulares
      #
      # A diferença importa na hora de decidir o que fazer: na 2 o banco está
      # intacto e alguém precisa autorizar; na 3 o sync funcionou e quem
      # resolve é o técnico da Royal, na planilha.
      - name: Explicar a falha
        if: failure()
        run: |
          echo "::warning::Sincronização terminou com falha. Veja o código de saída acima."
          echo ""
          echo "Saída 2 = guarda de sanidade. NADA foi gravado (mudança em massa,"
          echo "processo sumido, uid desconhecido ou muitos acessos revogados de"
          echo "uma vez). Se a mudança for legítima, rode este workflow"
          echo "manualmente com 'forcar' marcado."
          echo ""
          echo "Saída 3 = linha pendente na aba Titulares. O que dava para"
          echo "sincronizar FOI gravado; alguém ficou sem acesso por causa de"
          echo "célula malpreenchida. O detalhe de cada linha já está na coluna"
          echo "'Obs. Script' da planilha — avise o técnico da Royal."
          echo ""
          echo "Outro código = erro de verdade (configuração, rede, planilha)."
